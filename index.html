<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Definitely Not A LLC</title>
  <meta name="description" content="Definitely Not A LLC — developer site for our iOS apps.">
  <style>
    :root {
      --fg: #2a1a10;
      --muted: #6b5a4f;
      --bg: #fdf8f1;
      --accent: #b85a1f;
      --card: #ffffff;
      --border: #ead8c5;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }
    h1 {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: 40px;
      margin: 0 0 6px;
      letter-spacing: -0.5px;
    }
    .tagline { color: var(--muted); margin: 0 0 40px; }
    h2 {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: 22px;
      margin: 32px 0 12px;
    }
    .app {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin: 12px 0;
      text-decoration: none;
      color: var(--fg);
      transition: border-color .15s, transform .15s;
    }
    .app:hover { border-color: var(--accent); transform: translateY(-1px); }
    .app strong { display: block; font-size: 17px; margin-bottom: 2px; }
    .app span { color: var(--muted); font-size: 14px; }
    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Definitely Not A LLC</h1>
    <p class="tagline">Independent iOS apps from Definitely Not A LLC.</p>

    <h2>Apps</h2>

    <a class="app" href="https://defnotallc.github.io/western-dance-studio/">
      <strong>Western Dance Studio</strong>
      <span>Country &amp; western partner dances, line dances, metronome, and dance-hall finder. <em>Privacy policy &amp; support →</em></span>
    </a>

    <footer>
      © Definitely Not A LLC. Contact: <a href="mailto:defnota.official@gmail.com">defnota.official@gmail.com</a>.
    </footer>
  </main>
</body>
</html>
